server:
  port: 8000
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: purchase-approval
  datasource:
    url: jdbc:h2:mem:purchase;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        period: 0

logging:
  level:
    root: INFO
    com.acme.purchase: INFO

app:
  # 演示辅助开关：为 true 时允许通过 X-Demo-Delay-Ms 请求头人为延迟提交，
  # 用于现场演示"两人同时审批同一单"的并发冲突。生产环境必须置为 false。
  demo-mode: true
  approval:
    # 金额达到该阈值（含）时，主管审批后自动进入财务复核
    finance-threshold: 5000
